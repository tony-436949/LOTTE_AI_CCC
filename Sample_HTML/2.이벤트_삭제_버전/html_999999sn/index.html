    <script src="./js/jquery-3.3.1.min.js"></script>
    <script src="./js/gsap.min.js"></script>

  <body>
    <!-- ! eventBox [S] -->
    <div class="eventBox">
      <img src="./images/top_img.jpg" alt="" />

      <div class="img-box">
        <img src="./images/img_01.jpg" alt="" />
        <!-- .swiper 부모 .swiper-mask 필수 -->
        <div class="swiper-mask swiper-basic swiper1">
          <div class="swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <img src="./images/slide/1/1.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./images/slide/1/2.png" alt="" />
              </div>
              <div class="swiper-slide">
                <img src="./images/slide/1/3.png" alt="" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- eventBox [E] -->

    <script src="./js/common.js"></script>
    <script type="text/javascript">
      let swiperObj = {};
      for (let index = 1; index <= $(".swiper-mask").length; index++) {
        swiperObj[`swiper${index}`] = new Swiper(`.swiper${index} .swiper`, {
          observer: true,
          observeParents: true,
          slidesPerView: "auto",
          spaceBetween: parseInt($(window).width() * 0.06),
        });
      }
    </script>
  </body>
