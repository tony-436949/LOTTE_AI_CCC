            LINK_OBJ[fpState.linkIdx].url = document.getElementById('fpLinkUrl').value;
            LINK_OBJ[fpState.linkIdx].value = document.getElementById('fpLinkValue').value;
          }
          markChanged(); closeFp(); showToast('변경 사항이 적용되었습니다','s');
        } catch(e) { showToast('변경 적용 중 오류가 발생했습니다','e'); }
      });
    })();

    /* ═══════════════════════════════════════════════════════
       슬라이드 사이드 패널
       설명: 슬라이드를 관리하는 오른쪽 사이드 패널입니다.
             - openSlidePanel: 슬라이드 관리 패널을 여는 함수
             - renderSlideList: 슬라이드 목록을 화면에 그리는 함수
             - deleteSlide: 슬라이드를 삭제하는 함수 (최소 1개 유지)
             슬라이드 이미지 클릭 시 교체, 추가 버튼으로 새 슬라이드 추가 가능.
       ═══════════════════════════════════════════════════════ */
    var spState = {tabIdx:null, moduleIdx:0, slides:null}; /* 사이드 패널 상태 */

    /* --- openSlidePanel: 슬라이드 관리 패널을 여는 함수 ---
       탭 있는 구조: SLIDE_MODULES[tabIdx][moduleIdx]의 슬라이드 목록 표시
       탭 없는 구조: SLIDES 배열의 슬라이드 목록 표시 */

    function openSlidePanel(tabIdx, moduleIdx) {
      try {
        spState.tabIdx = tabIdx; spState.moduleIdx = moduleIdx;
        if (tabIdx !== null && tabIdx !== 'null') {
          var ti = parseInt(tabIdx), mi = parseInt(moduleIdx);
          spState.slides = (SLIDE_MODULES[ti] && SLIDE_MODULES[ti][mi]) ? SLIDE_MODULES[ti][mi].slides : [];
        } else { spState.slides = SLIDES; }
        renderSlideList(); openSp();
      } catch(e) {}
    }

    /* --- openSp / closeSp: 사이드 패널 열기/닫기 ---
       closeSp는 패널을 닫은 후 buildEditor()를 호출하여 미리보기를 갱신합니다. */
    function openSp() {
      document.getElementById('spBackdrop').classList.add('show');
      document.getElementById('sidePanel').classList.add('show');
    }

    function closeSp() {
      document.getElementById('spBackdrop').classList.remove('show');
      document.getElementById('sidePanel').classList.remove('show');
      buildEditor();
    }

    /* --- renderSlideList: 사이드 패널에 슬라이드 목록을 그리는 함수 ---
       각 슬라이드: 번호 + 미리보기 이미지(클릭하면 교체) + 파일명 + 삭제 버튼 */
    function renderSlideList() {
      var list = document.getElementById('spSlideList');
      list.innerHTML = '';
      var slides = spState.slides; if (!slides) return;
      for (var i = 0; i < slides.length; i++) {
        var sl = slides[i], src = sl.dataUrl || rImg(sl.src);
        var item = document.createElement('div');
        item.className = 'sp-slide-item';
        item.innerHTML = '<div class="sp-slide-num">'+(i+1)+'</div><img class="sp-slide-thumb" src="'+src+'" alt="슬라이드 '+(i+1)+'"><span class="sp-slide-info">'+(sl.name||sl.src||'새 슬라이드')+'</span><div class="sp-slide-del" data-idx="'+i+'">🗑</div>';
        (function(idx){
          item.querySelector('.sp-slide-thumb').addEventListener('click',function(){
            document.getElementById('spFileInput').setAttribute('data-slide-idx',idx);
            document.getElementById('spFileInput').click();
          });
          item.querySelector('.sp-slide-del').addEventListener('click',function(){ deleteSlide(idx); });
        })(i);
        list.appendChild(item);
      }
    }

    /* --- deleteSlide: 슬라이드를 삭제하는 함수 ---
       슬라이드가 1개만 남으면 삭제를 차단하고 오류 메시지를 표시합니다. */
    function deleteSlide(idx) {
      try {
        var slides = spState.slides; if (!slides) return;
        if (slides.length <= 1) { showToast('최소 1개의 슬라이드가 필요합니다','e'); return; }
        slides.splice(idx, 1); renderSlideList(); markChanged(); showToast('슬라이드가 삭제되었습니다','s');
      } catch(e) {}
    }

    /* --- 사이드 패널 이벤트 연결 ---
       닫기, 백드롭 클릭, 슬라이드 추가, 슬라이드 이미지 교체 동작 설정 */
    (function(){
      document.getElementById('spClose').addEventListener('click', closeSp);
      document.getElementById('spBackdrop').addEventListener('click', closeSp);
      /* 슬라이드 추가: 빈 슬라이드를 목록 끝에 추가하고 이미지 선택 대화상자 열기 */
      document.getElementById('spAddBtn').addEventListener('click', function(){
        try {
          var slides = spState.slides; if (!slides) return;
          slides.push({src:'',dataUrl:null,name:'새 슬라이드'});
          renderSlideList(); markChanged();
          document.getElementById('spFileInput').setAttribute('data-slide-idx', slides.length-1);
          document.getElementById('spFileInput').click();
        } catch(e) {}
      });
      document.getElementById('spFileInput').addEventListener('change', function(e){
        var file = e.target.files[0]; if (!file) return;
        var idx = parseInt(this.getAttribute('data-slide-idx')||'0');
        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            var slides = spState.slides;
            if (slides && slides[idx]) { slides[idx].dataUrl = ev.target.result; slides[idx].name = file.name; renderSlideList(); markChanged(); showToast('슬라이드 이미지가 교체되었습니다','s'); }
          } catch(e) {}
        };
        reader.readAsDataURL(file); e.target.value = '';
      });
    })();

    /* ═══════════════════════════════════════════════════════
       텍스트 편집
       설명: 텍스트 요소를 클릭하면 인라인 편집 모드로 전환됩니다.
             - 클릭 → contenteditable 활성화 → 텍스트 직접 수정 가능
             - "확인" → 변경 텍스트를 TEXT_MODS에 저장
             - "취소" → 원본 텍스트로 복원
       ═══════════════════════════════════════════════════════ */
    var textEditState = {element:null, originalText:'', uid:''}; /* 텍스트 편집 상태 */

    /* --- startTextEdit: 텍스트 인라인 편집을 시작하는 함수 ---
       텍스트 요소를 편집 가능하게 만들고, 위에 확인/취소 툴바를 표시합니다. */

    function startTextEdit(el) {
      try {
        if (el.classList.contains('editing')) return;
        textEditState = {element:el, originalText:el.textContent, uid:el.getAttribute('data-uid')||uid()};
        el.setAttribute('data-uid', textEditState.uid);
        el.contentEditable = 'true'; el.classList.add('editing'); el.focus();
        var tb = document.getElementById('txtToolbar');
        var r = el.getBoundingClientRect();
        tb.style.left = r.left+'px'; tb.style.top = (r.top-36)+'px';
        tb.classList.add('show');
      } catch(e) {}
    }

    (function(){
      document.getElementById('txtTbOk').addEventListener('click', function(){
        try {
          var el = textEditState.element; if (!el) return;
          TEXT_MODS[textEditState.uid] = el.textContent;
          el.contentEditable = 'false'; el.classList.remove('editing');
          document.getElementById('txtToolbar').classList.remove('show');
          markChanged(); showToast('텍스트가 수정되었습니다','s');
          textEditState = {element:null,originalText:'',uid:''};
        } catch(e) {}
      });
      document.getElementById('txtTbNo').addEventListener('click', function(){
        try {
          var el = textEditState.element; if (!el) return;
          el.textContent = textEditState.originalText;
          el.contentEditable = 'false'; el.classList.remove('editing');
          document.getElementById('txtToolbar').classList.remove('show');
          textEditState = {element:null,originalText:'',uid:''};
        } catch(e) {}
      });
    })();

    /* ═══════════════════════════════════════════════════════
       소스 영역 삭제/추가/이동
       설명: 콘텐츠 영역(이미지, 링크, 슬라이드)을 삭제, 추가, 순서 변경하는
             함수들입니다.
       ═══════════════════════════════════════════════════════ */

    /* --- deleteSourceArea: 콘텐츠 영역을 삭제하는 함수 ---
       최소 1개의 콘텐츠 영역은 유지해야 합니다.
       삭제된 이미지 경로는 DELETED_PATHS에 기록되어 내보내기 시 ZIP에서 제외됩니다. */
    function deleteSourceArea(el) {
      try {
        var parent = el.parentElement; if (!parent) return;
        var areas = parent.querySelectorAll('.ez');
        if (areas.length <= 1) { showToast('최소 1개의 콘텐츠 영역이 필요합니다','e'); return; }
        var path = el.getAttribute('data-path');
        if (path) DELETED_PATHS.push(path);
        var prev = el.previousElementSibling;
        if (prev && prev.classList.contains('insert-slide-zone')) prev.remove();
        el.remove(); markChanged(); showToast('콘텐츠 영역이 삭제되었습니다','s');
      } catch(e) {}
    }

    /* --- insertImage: 새 이미지를 추가하는 함수 ---
       파일 선택 대화상자를 열어 이미지를 선택하면:
       1. FileReader로 dataURL 변환
       2. ADDED_IMAGES와 MODIFIED에 저장
       3. 탭 rawContent에 <img> 태그 추가
       4. buildEditor() 호출로 미리보기 갱신 */
    function insertImage(tabIdx, position) {
      try {
        var input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.addEventListener('change', function(e){
          var file = e.target.files[0]; if (!file) return;
          var reader = new FileReader();
          reader.onload = function(ev){
            var dataUrl = ev.target.result;
            var newPath = 'images/added_'+Date.now()+'_'+file.name;
            ADDED_IMAGES[newPath] = dataUrl; MODIFIED[newPath] = dataUrl;
            if (tabIdx !== null && tabIdx >= 0 && TABS[tabIdx]) {
              TABS[tabIdx].rawContent += '\n<img src="./'+newPath+'" alt="" />';
            } else if (IS_NO_TAB) {
              NO_TAB_CONTENT += '\n<img src="./'+newPath+'" alt="" />';
            }
            buildEditor(); markChanged(); showToast('이미지가 추가되었습니다','s');
          };
          reader.readAsDataURL(file);
        });
        input.click();
      } catch(e) {}
    }

    /* --- insertSlide: 새 슬라이드를 추가하는 함수 (블록형) ---
       에디터에서 추가한 슬라이드는 블록형(이미지 세로 쌓기)으로 렌더링됩니다.
       원본 swiper 구조와 달리, 내보내기 시 개별 <img> 태그로 출력됩니다.
       추가 후 슬라이드 관리 패널이 자동으로 열립니다. */
    function insertSlide(tabIdx, position) {
      try {
        if (tabIdx !== null && tabIdx >= 0) {
          if (!SLIDE_MODULES[tabIdx]) SLIDE_MODULES[tabIdx] = [];
          SLIDE_MODULES[tabIdx].push({posIdx:SLIDE_MODULES[tabIdx].length, isOriginal:false, slides:[{src:'',dataUrl:null,name:'새 슬라이드'}]});
          /* rawContent에 swiper-mask를 추가하지 않음 — 블록형 슬라이드는 에디터 DOM에서 직접 관리 */
        } else {
          SLIDES.push({src:'',dataUrl:null,name:'새 슬라이드'});
        }
        buildEditor(); markChanged(); showToast('슬라이드가 추가되었습니다','s');
        if (tabIdx !== null && tabIdx >= 0) openSlidePanel(tabIdx, SLIDE_MODULES[tabIdx].length-1);
        else openSlidePanel(null, 0);
      } catch(e) {}
    }

    /* --- moveArea: 콘텐츠 영역의 순서를 변경하는 함수 ---
       'up' = 위로 이동 (이전 요소와 위치 교환)
       'down' = 아래로 이동 (다음 요소와 위치 교환)
       DOM 요소의 위치를 직접 변경하므로 buildOutput()에서 자동 반영됩니다. */
    function moveArea(btn, dir) {
      try {
        var ez = btn.closest('.ez'); if (!ez) return;
        if (dir === 'up') {
          var prev = ez.previousElementSibling;
          while (prev && prev.classList.contains('insert-slide-zone')) prev = prev.previousElementSibling;
          if (prev && prev.classList.contains('ez')) prev.parentElement.insertBefore(ez, prev);
        } else {
          var next = ez.nextElementSibling;
          while (next && next.classList.contains('insert-slide-zone')) next = next.nextElementSibling;
          if (next && next.classList.contains('ez')) next.parentElement.insertBefore(next, ez);
        }
        markChanged();
      } catch(e) {}
    }

    /* ═══════════════════════════════════════════════════════
       탭 관리
       설명: 탭을 추가, 삭제하고 탭 버튼 이미지를 교체하는 함수들입니다.
             - openTabMgr: 탭 관리 패널을 여는 함수
             - addTab: 새 탭을 추가하는 함수
             - deleteTab: 탭을 삭제하는 함수 (최소 1개 유지)
       ═══════════════════════════════════════════════════════ */

    /* --- openTabMgr: 탭 관리 패널을 여는 함수 ---
       탭 버튼을 더블클릭하면 호출됩니다.
       각 탭의 ON/OFF 이미지 업로드 영역과 삭제 버튼을 표시합니다.
       이미지 업로드 시에도 패널이 닫히지 않고 열린 상태를 유지합니다. */
    function openTabMgr() {
      try {
        var panel = document.getElementById('tabMgrPanel');
        var body = document.getElementById('tabMgrBody');
        body.innerHTML = '';
        for (var t = 0; t < TABS.length; t++) {
          var tab = TABS[t];
          var offSrc = tab.offImg.dataUrl || rImg(tab.offImg.src);
          var onSrc = tab.onImg.dataUrl || rImg(tab.onImg.src);
          var item = document.createElement('div');
          item.className = 'tab-mgr-item';
          item.innerHTML = '<div class="tab-mgr-item-hd"><span class="tab-mgr-badge">탭 '+(t+1)+' — '+escHtml(tab.name)+'</span><div class="tab-mgr-del" data-tab-idx="'+t+'">🗑</div></div><div class="tab-mgr-uploads"><div class="tab-mgr-upload" data-tab-idx="'+t+'" data-img-type="off">'+(offSrc?'<img src="'+offSrc+'" style="max-height:40px;margin:0 auto;">':'')+'<div class="tab-mgr-upload-label">OFF 이미지</div></div><div class="tab-mgr-upload" data-tab-idx="'+t+'" data-img-type="on">'+(onSrc?'<img src="'+onSrc+'" style="max-height:40px;margin:0 auto;">':'')+'<div class="tab-mgr-upload-label">ON 이미지</div></div></div>';
          (function(idx){item.querySelector('.tab-mgr-del').addEventListener('click',function(){deleteTab(idx);openTabMgr();});})(t);
          var uploads = item.querySelectorAll('.tab-mgr-upload');
          for (var u = 0; u < uploads.length; u++) {
            (function(ul){ul.addEventListener('click',function(){
              document.getElementById('tabMgrFileInput').setAttribute('data-tab-idx',this.getAttribute('data-tab-idx'));
              document.getElementById('tabMgrFileInput').setAttribute('data-img-type',this.getAttribute('data-img-type'));
              document.getElementById('tabMgrFileInput').click();
            });})(uploads[u]);
          }
          body.appendChild(item);
        }
        panel.style.left='50%'; panel.style.top='50%'; panel.style.transform='translate(-50%,-50%)';
        panel.classList.add('show');
      } catch(ex) { console.error(ex); }
    }

    /* --- 탭 관리 패널 이벤트 연결 ---
       닫기 버튼, 탭 이미지 업로드 동작을 설정합니다.
       이미지 업로드 후: 탭 버튼 이미지 직접 갱신 + 패널 내용 갱신 (패널은 열린 상태 유지) */
    (function(){
      document.getElementById('tabMgrClose').addEventListener('click',function(){document.getElementById('tabMgrPanel').classList.remove('show');});
      document.getElementById('tabMgrFileInput').addEventListener('change',function(e){
        var file = e.target.files[0]; if (!file) return;
        var tIdx = parseInt(this.getAttribute('data-tab-idx'));
        var imgType = this.getAttribute('data-img-type');
        var reader = new FileReader();
        reader.onload = function(ev){
          try {
            if (TABS[tIdx]) {
              if (imgType==='on') { TABS[tIdx].onImg.dataUrl=ev.target.result; TABS[tIdx].onImg.name=file.name; }
              else { TABS[tIdx].offImg.dataUrl=ev.target.result; TABS[tIdx].offImg.name=file.name; }
              markChanged();
              /* 탭 버튼 이미지 직접 갱신 (buildEditor 호출하지 않음) */
              var tbw = document.getElementById('tabBtnWrap');
              if (tbw) {
                var btns = tbw.querySelectorAll('.tab-btn');
                if (btns[tIdx]) {
                  var img = btns[tIdx].querySelector('img');
                  if (img) {
                    if (tIdx === activeTabIdx) {
                      img.src = TABS[tIdx].onImg.dataUrl || rImg(TABS[tIdx].onImg.src);
                    } else {
                      img.src = TABS[tIdx].offImg.dataUrl || rImg(TABS[tIdx].offImg.src);
                    }
                  }
                }
              }
              /* 탭 관리 패널 내용 갱신 (패널은 열린 상태 유지) */
              openTabMgr();
              showToast('탭 이미지가 교체되었습니다','s');
            }
          } catch(ex) { console.error(ex); }
        };
        reader.readAsDataURL(file); e.target.value='';
      });
    })();

    /* --- addTab: 새 탭을 추가하는 함수 ---
       TABS 배열 끝에 빈 탭을 추가하고, buildEditor()로 미리보기를 갱신합니다.
       새 탭에는 플레이스홀더 이미지 블록이 기본으로 표시됩니다.
       추가 후 자동으로 새 탭으로 전환됩니다. */
    function addTab() {
      try {
        var newIdx = TABS.length;
        TABS.push({name:'탭 '+(newIdx+1), offImg:{src:'',dataUrl:null,name:''}, onImg:{src:'',dataUrl:null,name:''}, rawContent:''});
        SLIDE_MODULES[newIdx] = [];
        buildEditor(); markChanged(); showToast('탭이 추가되었습니다','s');
        /* 새 탭으로 전환 */
        switchTab(newIdx);
      } catch(e) {}
    }

    /* --- deleteTab: 탭을 삭제하는 함수 ---
       탭이 1개만 남으면 삭제를 차단합니다.
       삭제 시 해당 탭의 콘텐츠 영역과 슬라이드 모듈도 함께 제거됩니다.
       SLIDE_MODULES의 인덱스를 재정렬합니다. */
    function deleteTab(idx) {
      try {
        if (TABS.length <= 1) { showToast('최소 1개의 탭이 필요합니다','e'); return; }
        TABS.splice(idx, 1);
        var newMod = {}, keys = Object.keys(SLIDE_MODULES).map(Number).sort(), ni = 0;
        for (var k = 0; k < keys.length; k++) { if (keys[k]===idx) continue; newMod[ni]=SLIDE_MODULES[keys[k]]; ni++; }
        SLIDE_MODULES = newMod;
        if (activeTabIdx >= TABS.length) activeTabIdx = TABS.length-1;
        buildEditor(); markChanged(); showToast('탭이 삭제되었습니다','s');
      } catch(e) {}
    }

    /* ═══════════════════════════════════════════════════════
       콘텐츠 정보 드로어
       설명: 콘텐츠명(contentName)과 태깅코드(contentCode)를 확인하고
             수정할 수 있는 하단 패널입니다.
             값을 수정하면 markChanged()가 호출되어 변경 상태가 추적됩니다.
             수정된 값은 ZIP 내보내기 시 index.html의 <head> 스크립트에 반영됩니다.
       ═══════════════════════════════════════════════════════ */
    /* --- openInfo: 콘텐츠 정보 드로어를 여는 함수 --- */
    function openInfo() {
      try {
        document.getElementById('infoName').value = contentName;
        document.getElementById('infoCode').value = contentCode;
        document.getElementById('infoDrawer').classList.add('show');
      } catch(e) {}
    }
    /* --- closeInfo: 콘텐츠 정보 드로어를 닫는 함수 --- */
    function closeInfo() { document.getElementById('infoDrawer').classList.remove('show'); }

    (function(){
      document.getElementById('btnInfo').addEventListener('click', openInfo);
      document.getElementById('infoClose').addEventListener('click', closeInfo);
      document.getElementById('infoName').addEventListener('input', function(){ contentName=this.value; markChanged(); });
      document.getElementById('infoCode').addEventListener('input', function(){ contentCode=this.value; markChanged(); });
    })();

    /* ═══════════════════════════════════════════════════════
       에디터 초기화
       설명: "초기화" 버튼을 클릭하면 페이지를 새로고침하여
             모든 편집 내용을 취소하고 원본 상태로 되돌립니다.
             (location.reload()로 모든 전역 변수가 초기화됩니다)
       ═══════════════════════════════════════════════════════ */
    document.getElementById('btnReset').addEventListener('click', function(){ location.reload(); });

    /* ═══════════════════════════════════════════════════════
       buildOutput — 편집된 내용을 HTML로 재구성하는 함수 (DOM 기반)
       설명: 에디터 DOM(#phone)의 현재 상태를 직접 읽어서 내보내기용
             index.html 문자열을 생성합니다.

             핵심 동작:
             1. 원본 HTML_SRC를 DOM으로 파싱하여 템플릿으로 사용
             2. <head> 스크립트의 contentName, contentCode, linkObj 갱신
             3. eventBox 내부를 비우고, 에디터 DOM에서 현재 상태를 읽어 재구성
             4. 각 .ez 요소를 원본 HTML 구조로 변환:
                - ez-img → <img> 태그
                - ez-link → <a class="link-btn"> 태그
                - ez-slide-item (원본) → swiper-mask 구조
                - ez-slide-item (추가, 블록형) → 개별 <img> 태그
                - ext-img-section → 외부 URL <img> 태그

             구현 변경: rawContent 문자열 대신 라이브 DOM을 소스로 사용하여
             추가/삭제/순서변경이 자동으로 반영됩니다.
       ═══════════════════════════════════════════════════════ */
    function buildOutput() {
      try {
        var parser = new DOMParser();
        var doc = parser.parseFromString(HTML_SRC, 'text/html');

        /* head 스크립트 갱신 (contentName, contentCode, linkObj) */
        var scripts = doc.querySelectorAll('head script');
        for (var i = 0; i < scripts.length; i++) {
          var text = scripts[i].textContent;
          if (text.indexOf('contentName') !== -1 || text.indexOf('linkObj') !== -1) {
            var ns = '\n      // <!-- TODO 링크 데이터 설정 [S] -->\n';
            ns += '      const contentName = "'+contentName.replace(/"/g,'\\"')+'";\n';
            ns += '      const contentCode = "'+contentCode.replace(/"/g,'\\"')+'";\n\n';
            ns += '      const linkObj = [\n';
            for (var l = 0; l < LINK_OBJ.length; l++) {
              var lo = LINK_OBJ[l];
              ns += '        {\n          type: "'+(lo.type||'').replace(/"/g,'\\"')+'",\n          url: "'+(lo.url||'').replace(/"/g,'\\"')+'",\n          value: "'+(lo.value||'').replace(/"/g,'\\"')+'",\n        }'+(l<LINK_OBJ.length-1?',':'')+'\n';
            }
            ns += '      ];\n      // <!-- TODO 링크 데이터 설정 [E] -->\n    ';
            scripts[i].textContent = ns;
            break;
          }
        }

        /* eventBox 재구성 — 에디터 DOM에서 현재 상태를 읽어서 생성 */
        var eventBox = doc.querySelector('.eventBox');
        if (!eventBox) return '<!doctype html>\n'+doc.documentElement.outerHTML;
        eventBox.innerHTML = '';

        var phone = document.getElementById('phone');

        function addDot(p) {
          if (!p) return '';
          if (p.startsWith('./')||p.startsWith('http://')||p.startsWith('https://')) return p;
          return './'+p;
        }

        /* 에디터 DOM의 .ez 요소들을 순회하여 원본 HTML 구조로 변환 */
        function exportEzElements(container, targetEl) {
          var children = container.children;
          var swiperCounter = 1;

          for (var c = 0; c < children.length; c++) {
            var child = children[c];

            /* 에디터 UI 요소 건너뛰기 */
            if (child.classList.contains('insert-slide-zone')) continue;
            if (child.classList.contains('tab-btn-wrap')) continue;
            if (child.classList.contains('tab-add-bar')) continue;
            if (child.classList.contains('tab-content-area')) continue;

            if (child.classList.contains('ez-img')) {
              /* 이미지 블록 */
              var path = child.getAttribute('data-path')||'';
              var imgEl = child.querySelector('img');
              var alt = imgEl ? (imgEl.getAttribute('alt')||'') : '';
              var img = doc.createElement('img');
              img.setAttribute('src', addDot(path));
              img.setAttribute('alt', alt);
              targetEl.appendChild(img);
              targetEl.appendChild(doc.createTextNode('\n'));

            } else if (child.classList.contains('ez-link')) {
              /* 링크 블록 */
              var path = child.getAttribute('data-path')||'';
              var linkIdx = parseInt(child.getAttribute('data-link-idx')||'0');
              var imgEl = child.querySelector('img');
              var alt = imgEl ? (imgEl.getAttribute('alt')||'') : '';
              var a = doc.createElement('a');
              a.setAttribute('href', '#');
              a.setAttribute('id', 'link'+linkIdx);
              a.setAttribute('data-order', String(linkIdx));
              a.className = 'link-btn kioskDel';
              var linkImg = doc.createElement('img');
              linkImg.setAttribute('src', addDot(path));
              linkImg.setAttribute('alt', alt);
              a.appendChild(linkImg);
              targetEl.appendChild(a);
              targetEl.appendChild(doc.createTextNode('\n'));

            } else if (child.classList.contains('ez-slide-item') || child.classList.contains('inline-slide-module')) {
              /* 슬라이드 블록 */
              var tabIdxAttr = child.getAttribute('data-tab-idx');
              var moduleIdx = parseInt(child.getAttribute('data-module-idx')||'0');
              var isBlockSlide = child.getAttribute('data-block-slide') === 'true';
              var slides;
              if (tabIdxAttr !== null && tabIdxAttr !== 'null' && tabIdxAttr !== '') {
                var ti = parseInt(tabIdxAttr);
                slides = (SLIDE_MODULES[ti] && SLIDE_MODULES[ti][moduleIdx]) ? SLIDE_MODULES[ti][moduleIdx].slides : [];
              } else {
                slides = SLIDES;
              }

              if (isBlockSlide) {
                /* 에디터에서 추가한 슬라이드 — 블록형 <img> 태그로 내보내기 */
                for (var s = 0; s < slides.length; s++) {
                  var si = doc.createElement('img');
                  var slideSrc = slides[s].src;
                  if (!slideSrc && slides[s].dataUrl) {
                    if (tabIdxAttr !== null && tabIdxAttr !== 'null' && tabIdxAttr !== '') {
                      slideSrc = 'images/tab'+(parseInt(tabIdxAttr)+1)+'/added_slide_'+(moduleIdx+1)+'_'+(s+1)+'.png';
                    } else {
                      slideSrc = 'images/added_slide_'+(s+1)+'.png';
                    }
                    slides[s].src = slideSrc;
                  }
                  si.setAttribute('src', addDot(slideSrc));
                  si.setAttribute('alt', '');
                  targetEl.appendChild(si);
                  targetEl.appendChild(doc.createTextNode('\n'));
                }
              } else {
                /* 원본 슬라이드 — swiper-mask 구조로 내보내기 */
                var mask = doc.createElement('div');
                mask.className = 'swiper-mask swiper-basic swiper'+swiperCounter;
                var swiper = doc.createElement('div');
                swiper.className = 'swiper';
                var wrapper = doc.createElement('div');
                wrapper.className = 'swiper-wrapper';

                for (var s = 0; s < slides.length; s++) {
                  var sd = doc.createElement('div');
                  sd.className = 'swiper-slide';
                  var si = doc.createElement('img');
                  var slideSrc = slides[s].src;
                  if (!slideSrc && slides[s].dataUrl) {
                    if (tabIdxAttr !== null && tabIdxAttr !== 'null' && tabIdxAttr !== '') {
                      slideSrc = 'images/tab'+(parseInt(tabIdxAttr)+1)+'/slide/'+(moduleIdx+1)+'/'+(s+1)+'.png';
                    } else {
                      slideSrc = 'images/slide/'+swiperCounter+'/'+(s+1)+'.png';
                    }
                    slides[s].src = slideSrc;
                  }
                  si.setAttribute('src', addDot(slideSrc));
                  si.setAttribute('alt', '');
                  sd.appendChild(si);
                  wrapper.appendChild(sd);
                  wrapper.appendChild(doc.createTextNode('\n'));
                }

                swiper.appendChild(wrapper);
                mask.appendChild(swiper);
                targetEl.appendChild(mask);
                targetEl.appendChild(doc.createTextNode('\n'));
                swiperCounter++;
              }

            } else if (child.classList.contains('ext-img-section')) {
              /* 외부 이미지 */
              var path = child.getAttribute('data-path')||'';
              var imgEl = child.querySelector('img');
              var alt = imgEl ? (imgEl.getAttribute('alt')||'') : '';
              var img = doc.createElement('img');
              img.setAttribute('src', path); /* 외부 URL은 그대로 */
              img.setAttribute('alt', alt);
              targetEl.appendChild(img);
              targetEl.appendChild(doc.createTextNode('\n'));
            }
          }
        }

        if (!IS_NO_TAB && TABS.length > 0) {
          /* 상단 이미지 (탭 버튼 이전) — 에디터 DOM에서 읽기 */
          var phoneChildren = phone.children;
          for (var i = 0; i < phoneChildren.length; i++) {
            var ch = phoneChildren[i];
            if (ch.classList.contains('tab-btn-wrap')) break;
            if (ch.classList.contains('tab-add-bar')) break;
            if (ch.classList.contains('tab-content-area')) break;
            if (ch.classList.contains('ez-img')) {
              var path = ch.getAttribute('data-path')||'';
              var imgEl = ch.querySelector('img');
              var alt = imgEl ? (imgEl.getAttribute('alt')||'') : '';
              var img = doc.createElement('img');
              img.setAttribute('src', addDot(path));
              img.setAttribute('alt', alt);
              eventBox.appendChild(img);
              eventBox.appendChild(doc.createTextNode('\n'));
            }
          }

          /* 탭 버튼 영역 */
          var tba = doc.createElement('div');
          tba.className = 'tab-btn-area '+TAB_TYPE;
          for (var t = 0; t < TABS.length; t++) {
            var tab = TABS[t];
            var bd = doc.createElement('div');
            bd.className = 'tab-btn'+(t===0?' on':'');
            if (tab.name) bd.setAttribute('data-tab-name', tab.name);
            var offI = doc.createElement('img');
            offI.setAttribute('src', addDot(tab.offImg.src||'images/tab/tab'+(t+1)+'_off.jpg'));
            offI.setAttribute('alt','');
            bd.appendChild(offI);
            var onI = doc.createElement('img');
            onI.setAttribute('src', addDot(tab.onImg.src||'images/tab/tab'+(t+1)+'_on.jpg'));
            onI.setAttribute('alt','');
            bd.appendChild(onI);
            tba.appendChild(bd);
            tba.appendChild(doc.createTextNode('\n'));
          }
          eventBox.appendChild(tba);
          eventBox.appendChild(doc.createTextNode('\n'));

          /* 각 탭 콘텐츠 영역 — 에디터 DOM에서 읽기 */
          for (var t = 0; t < TABS.length; t++) {
            var ta = doc.createElement('div');
            ta.className = 'tab-area img-box';
            var tabArea = document.getElementById('tabArea_'+t);
            if (tabArea) {
              exportEzElements(tabArea, ta);
            }
            eventBox.appendChild(ta);
            eventBox.appendChild(doc.createTextNode('\n'));
          }
        } else {
          /* 탭 없는 구조 — 에디터 DOM에서 읽기 */
          var phoneChildren = phone.children;
          for (var i = 0; i < phoneChildren.length; i++) {
            var ch = phoneChildren[i];
            if (ch.id === 'noTabContent') break;
            if (ch.classList.contains('insert-slide-zone')) continue;
            if (ch.classList.contains('ez-img')) {
              var path = ch.getAttribute('data-path')||'';
              var imgEl = ch.querySelector('img');
              var alt = imgEl ? (imgEl.getAttribute('alt')||'') : '';
              var img = doc.createElement('img');
              img.setAttribute('src', addDot(path));
              img.setAttribute('alt', alt);
              eventBox.appendChild(img);
              eventBox.appendChild(doc.createTextNode('\n'));
            }
          }

          var ib = doc.createElement('div');
          ib.className = 'img-box';
          var noTabEl = document.getElementById('noTabContent');
          if (noTabEl) {
            exportEzElements(noTabEl, ib);
          }
          eventBox.appendChild(ib);
          eventBox.appendChild(doc.createTextNode('\n'));
        }

        /* body 하단 스크립트는 이미 doc에 포함되어 있으므로 별도 처리 불필요 */

        return '<!doctype html>\n'+doc.documentElement.outerHTML;
      } catch(err) {
        console.error('HTML 재구성 오류:', err);
        showToast('HTML 재구성 중 오류가 발생했습니다','e');
        return HTML_SRC;
      }
    }

    /* ═══════════════════════════════════════════════════════
       exportZip — 편집된 내용을 ZIP 파일로 저장하는 함수
       설명: 편집된 모든 내용을 ZIP 파일로 재조립하여 다운로드합니다.

             처리 순서:
             1. buildOutput()으로 편집된 index.html 문자열 생성
             2. 원본 ZIP_FILES의 파일들을 ZIP에 추가 (css/, js/ 등 변경 없이)
                - 삭제된 파일(DELETED_PATHS)은 제외
                - 교체된 이미지(MODIFIED)는 새 데이터로 덮어쓰기
             3. 슬라이드 이미지 추가 (새로 추가되거나 교체된 것)
             4. 탭 버튼 이미지 추가 (ON/OFF 이미지)
             5. 새로 추가된 이미지(ADDED_IMAGES) 추가
             6. ZIP Blob 생성 → 브라우저 다운로드
       ═══════════════════════════════════════════════════════ */
    async function exportZip() {
      try {
        showLoading('ZIP 파일을 생성하고 있습니다...','');
        document.getElementById('btnExp').disabled = true;
        var outputHtml = buildOutput();
        var zip = new JSZip();

        /* 원본 파일 추가 (index.html 제외, 삭제된 파일 제외) */
        var keys = Object.keys(ZIP_FILES);
        for (var i = 0; i < keys.length; i++) {
          var p = keys[i];
          if (p === 'index.html') continue;
          if (DELETED_PATHS.indexOf(p) !== -1) continue;
          if (MODIFIED[p]) {
            zip.file(p, dataUrlToUint8Array(MODIFIED[p]));
          } else {
            zip.file(p, ZIP_FILES[p]);
          }
        }

        /* 편집된 index.html */
        zip.file('index.html', outputHtml);

        /* 슬라이드 이미지 (새로 추가되거나 교체된 것) */
        if (!IS_NO_TAB) {
          for (var t = 0; t < TABS.length; t++) {
            var mods = SLIDE_MODULES[t]||[];
            for (var m = 0; m < mods.length; m++) {
              for (var s = 0; s < mods[m].slides.length; s++) {
                var sl = mods[m].slides[s];
                if (sl.dataUrl && sl.src) {
                  zip.file(sl.src, dataUrlToUint8Array(sl.dataUrl));
                }
              }
            }
            /* 탭 버튼 이미지 */
            var tab = TABS[t];
            if (tab.offImg.dataUrl) {
              var offPath = tab.offImg.src||'images/tab/tab'+(t+1)+'_off.jpg';
              zip.file(offPath, dataUrlToUint8Array(tab.offImg.dataUrl));
            }
            if (tab.onImg.dataUrl) {
              var onPath = tab.onImg.src||'images/tab/tab'+(t+1)+'_on.jpg';
              zip.file(onPath, dataUrlToUint8Array(tab.onImg.dataUrl));
            }
          }
        } else {
          for (var s = 0; s < SLIDES.length; s++) {
            var sl = SLIDES[s];
            if (sl.dataUrl && sl.src) {
              zip.file(sl.src, dataUrlToUint8Array(sl.dataUrl));
            }
          }
        }

        /* 추가된 이미지 파일 */
        var addedKeys = Object.keys(ADDED_IMAGES);
        for (var i = 0; i < addedKeys.length; i++) {
          zip.file(addedKeys[i], dataUrlToUint8Array(ADDED_IMAGES[addedKeys[i]]));
        }

        var blob = await zip.generateAsync({type:'blob'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = (document.getElementById('topbarHint').textContent||'content');
        if (!a.download.endsWith('.zip')) a.download += '.zip';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        hideLoading(); document.getElementById('btnExp').disabled = false;
        showToast('ZIP 파일이 저장되었습니다','s');
      } catch(err) {
        console.error('ZIP 생성 오류:', err);
        showToast('ZIP 생성 실패','e');
        hideLoading(); document.getElementById('btnExp').disabled = false;
      }
    }

    document.getElementById('btnExp').addEventListener('click', exportZip);

    /* ═══════════════════════════════════════════════════════
       오류 처리 및 패널 외부 클릭
       설명: 전역 오류 핸들러와 패널 외부 클릭 시 닫기 동작을 설정합니다.
             - 플로팅 패널: 외부 클릭 시 자동 닫힘
             - 탭 관리 패널: X 버튼으로만 닫힘 (자동 닫힘 방지)
       ═══════════════════════════════════════════════════════ */
    window.addEventListener('error', function(e) { console.error('전역 오류:', e.message); });

    document.addEventListener('click', function(e) {
      try {
        var fp = document.getElementById('floatingPanel');
        var tm = document.getElementById('tabMgrPanel');
        if (fp.classList.contains('show') && !fp.contains(e.target) && !e.target.closest('.ez')) closeFp();
        /* 탭 관리 패널은 X 버튼으로만 닫기 — 자동 닫힘 방지 */
      } catch(ex) {}
    });

    /* --- CDN 로드 확인: JSZip 라이브러리가 정상적으로 로드되었는지 확인 ---
       인터넷 연결이 없으면 JSZip을 사용할 수 없으므로 안내 메시지를 표시합니다. */
    if (typeof JSZip === 'undefined') {
      document.querySelector('.dropzone-label').textContent = 'JSZip 라이브러리를 로드할 수 없습니다';
      document.querySelector('.dropzone-desc').textContent = '인터넷 연결을 확인해주세요';
    }
  </script>
</body>
</html>
